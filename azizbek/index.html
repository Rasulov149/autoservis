<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shapes Task</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div>
  <section class="example-box">
    <h3>position: static</h3>
    <div class="container static-layout">
      <div class="box red">One</div>
      <div class="box green">Two</div>
      <div class="box red">Three</div>
      <div class="box red">Four</div>
    </div>
  </section>

  <section class="example-box">
    <h3>position: relative</h3>
    <div class="container relative-layout">
      <div class="box red">One</div>
      <div class="box green target-rel">Two</div>
      <div class="box red">Three</div>
      <div class="box red">Four</div>
    </div>
  </section>

  <section class="example-box">
    <h3>position: absolute</h3>
    <div class="container absolute-layout">
      <div class="box red">One</div>
      <div class="box green target-abs">Two</div>
      <div class="box red">Three</div>
      <div class="box red">Four</div>
    </div>
  </section>
</div>
</body>
</html>
